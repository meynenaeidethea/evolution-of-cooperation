name: Full experiment suite
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./gradlew test installDist
      - run: python -m pip install -r scripts/requirements.txt
      - run: simulation/build/install/simulation/bin/simulation --scenario all --threads 2 --snapshots --output results/full
      - run: python scripts/analyze.py results/full
      - uses: actions/upload-artifact@v4
        with:
          name: full-study
          path: results/full
